# Server port
server.port=8080

# H2 database stored as a file in ./data/flashcards.mv.db so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/flashcards
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto create/update tables based on the Flashcard entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: H2 web console at http://localhost:8080/h2-console (useful for checking data directly)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
